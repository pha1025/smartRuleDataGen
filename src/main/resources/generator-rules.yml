      - name: "income_khjl_outlet_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_outlet_code"
        nullable: false
      - name: "income_khjl_outlet_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_outlet_name"
        nullable: false
      - name: "zx_payment_amount"
        type: "RANDOM_DOUBLE"
