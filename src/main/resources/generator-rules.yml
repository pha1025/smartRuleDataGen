# src/main/resources/generator-rules.yml
generators:
  customerReviewExpire: # 唯一标识符，用户在CLI中选择
    tableName: "cctest_not_delete.ads_itcrm_customer_review_zx_product_expire"
    dbKey: "db2"
    sqlTemplateKey: "customer_review_expire" # 对应SqlTemplateRepository中的Key
    fields:
      - name: "end_date_month"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "getParamOrDefault('end_date_month', getCurrentMonth())"
        nullable: false
      - name: "end_date"
        type: "EXPRESSION"
        sqlType: "DATE"
        expression: "randomDateInMonth(end_date_month)"
        dependsOn: "end_date_month"
        nullable: false
      - name: "customer_id"
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        refDataType: "CustomerData"
        lookupKeyField: "type"
        lookupValueSource: "1"
        fieldToPopulate: "id"
        nullable: false
      - name: "customer_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "customer_name" # From pre-filled
        nullable: false
      - name: "outlet_code"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: "004012020002"
        nullable: false
      - name: "renew_type_code"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "renew_type"
        lookupBy: "NAME"
        targetField: "CODE"
        nullable: false
      - name: "renew_type"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "renew_type"
        lookupBy: "CODE"
        targetField: "NAME"
        dependsOn: "renew_type_code"
        nullable: false
      - name: "expect_renew_type_code"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "expect_renew_type"
        lookupBy: "NAME"
        targetField: "CODE"
        nullable: false
      - name: "expect_renew_type"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "expect_renew_type"
        lookupBy: "CODE"
        targetField: "NAME"
        dependsOn: "expect_renew_type_code"
        nullable: false
      - name: "is_renew_code"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "renew_type_code"
        conditions:
          - ifExpression: "renew_type_code != 'unRenewed'"
            thenValue: "'Y'"
          - elseValue: "'N'"
        nullable: false
      - name: "is_renew"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "is_renew_code"
        conditions:
          - ifExpression: "is_renew_code == 'Y'"
            thenValue: "'已续费'"
          - elseValue: "'未续费'"
        nullable: false
      - name: "cur_package_paid_amount"
        type: "RANDOM_DOUBLE"
        sqlType: "DECIMAL"
        min: 500
        max: 5000
        precision: 2
        nullable: false
      - name: "cur_package_sales_amount" # 新增字段
        type: "EXPRESSION"
        sqlType: "DECIMAL"
        expression: "cur_package_paid_amount + randomInt(0, 100)"
        nullable: false
      - name: "real_package_sales_amt"
        type: "EXPRESSION"
        sqlType: "DECIMAL"
        expression: "cur_package_paid_amount + randomInt(0, 100)"
        dependsOn: "cur_package_paid_amount"
        nullable: false
      - name: "renew_package_sales_amount"
        type: "RANDOM_DOUBLE"
        sqlType: "DECIMAL"
        min: 500
        max: 6000
        precision: 2
        nullable: false
      - name: "package_level"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["基础版", "专业版", "旗舰版"]
        nullable: false
      - name: "action_names"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["智能办税", "风控", "报销", "发票管理", "智能办税,风控"]
        nullable: false
      - name: "renew_package_level"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "package_level"
        dependsOn: "package_level"
        nullable: false
      - name: "avg_applicants_num"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 10
        nullable: false
      - name: "in_invoice_avg_amt"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 1000
        nullable: false
      - name: "out_invoice_avg_amt"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 1000
        nullable: false
      - name: "is_compliance_tax_target"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["Y", "N"]
        nullable: false
      - name: "active_compliance_status"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "is_compliance_tax_target"
        conditions:
          - ifExpression: "is_compliance_tax_target == 'Y'"
            thenValue: "'compliance'"
          - elseValue: "'notCompliance'"
        nullable: false
      - name: "_has_follow"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        includeInSql: false
        expression: "randomBoolean(0.6)"
        nullable: false
      - name: "lastest_follow_time"
        type: "CONDITIONAL"
        sqlType: "DATETIME"
        dependsOn: "_has_follow"
        conditions:
          - ifExpression: "_has_follow == true"
            thenValue: "randomDateTimeBeforeNow('yyyy-MM-dd HH:mm:ss', 30)"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_type"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "lastest_follow_time"
        conditions:
          - ifExpression: "lastest_follow_time != NULL"
            thenValue: "lookupEnumCode('businessAction', 'RANDOM')"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_type_name"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "follow_type"
        conditions:
          - ifExpression: "follow_type != NULL"
            thenValue: "lookupEnumName('businessAction', follow_type)"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_progress"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "lastest_follow_time"
        conditions:
          - ifExpression: "lastest_follow_time != NULL"
            thenValue: "lookupEnumCode('specificItem', 'RANDOM')"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_progress_name"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "follow_progress"
        conditions:
          - ifExpression: "follow_progress != NULL"
            thenValue: "lookupEnumName('specificItem', follow_progress)"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_intention"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "lastest_follow_time"
        conditions:
          - ifExpression: "lastest_follow_time != NULL"
            thenValue: "lookupEnumCode('followResult', 'RANDOM')"
          - elseValue: "NULL"
        nullable: true
      - name: "follow_intention_name"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "follow_intention"
        conditions:
          - ifExpression: "follow_intention != NULL"
            thenValue: "lookupEnumName('followResult', follow_intention)"
          - elseValue: "NULL"
        nullable: true
      - name: "_has_order"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        includeInSql: false
        expression: "randomBoolean(0.8)"
        nullable: false
      - name: "lastest_payment_method"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "_has_order"
        conditions:
            - ifExpression: "_has_order == true"
              thenValue: "lookupEnumCode('pay_method', 'RANDOM')"
            - elseValue: "NULL"
        nullable:  true
      - name: "lastest_payment_method_name"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "lastest_payment_method"
        conditions:
            - ifExpression: "lastest_payment_method != NULL"
              thenValue: "lookupEnumName('pay_method', lastest_payment_method)"
            - elseValue: "NULL"
        nullable: true
      - name: "lastest_payment_time"
        type: "CONDITIONAL"
        sqlType: "DATE"
        dependsOn: "lastest_payment_method"
        conditions:
          - ifExpression: "lastest_payment_method != 'NULL'"
            thenValue: "randomDateTimeBeforeNow('yyyy-MM-dd', 60)"
          - elseValue: "NULL"
        nullable: true
      - name: "lastest_order_time"
        type: "CONDITIONAL"
        sqlType: "DATE"
        dependsOn: "lastest_payment_method"
        conditions:
          - ifExpression: "lastest_payment_method != 'NULL'"
            thenValue: "randomDateTimeBeforeNow('yyyy-MM-dd', 60)"
          - elseValue: "NULL"
        nullable: true
      - name: "customer_manage_id"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        includeInSql: false
        expression: "customer_manage_id" # From pre-filled
        nullable: false
      - name: "cust_mgr_id"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "customer_manage_id"
        dependsOn: "customer_manage_id"
        nullable: false
      - name: "cust_mgr_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrName')"
        dependsOn: "cust_mgr_id"
        nullable: false
      - name: "big_region_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrBigRegionCode')"
        dependsOn: "cust_mgr_id"
        nullable: false
      - name: "province_city_area_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustomerField(customer_id, 'provinceCityAreaCode')"
        dependsOn: "customer_id"
        nullable: false
      - name: "is_order"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        dependsOn: "_has_order"
        conditions:
          - ifExpression: "_has_order == true"
            thenValue: "'Y'"
          - elseValue: "'N'"
        nullable: false

  itcrmCustMgrWorkloadStatistics:
    tableName: "servyou_ads.ads_itcrm_cust_mgr_workload_statistics_rt"
    dbKey: "db1"
