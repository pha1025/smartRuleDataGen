      - name: "income_khjl_outlet_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_outlet_code"
        nullable: false
      - name: "income_khjl_outlet_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_outlet_name"
        nullable: false
      - name: "zx_payment_amount"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 100
        max: 5000
        nullable: false
      - name: "cust_mgr_big_region_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrBigRegionCode')"
        nullable: false
      - name: "zx_group_payment_amount"
        type: "CONDITIONAL"
        sqlType: "INT"
        nullable: true
        conditions:
          - ifExpression: "cust_mgr_big_region_code == '004012022'"
            thenValue: "zx_payment_amount"
          - elseValue: "NULL"
      - name: "group_id"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'groupId')"
        nullable: true
      - name: "group_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'groupName')"
        nullable: true
      - name: "zx_assessment_payment_amount"
        type: "STATIC"
        sqlType: "INT"
        value: "0"
        nullable: false
      - name: "cust_mgr_big_region_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrBigRegionName')"
        nullable: false
      - name: "income_khjl_big_region_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_big_region_code"
        nullable: false
      - name: "income_khjl_big_region_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "cust_mgr_big_region_name"
        nullable: false
      - name: "customer_id"
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        refDataType: "CustomerData"
        lookupKeyField: "type"
        lookupValueSource: "1" # Default to Type 1
        fieldToPopulate: "id"
        defaultNotFoundValue: "CUST_DEFAULT"
        nullable: false
      - name: "customer_name"
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        refDataType: "CustomerData"
        lookupKeyField: "id"
        lookupValueSource: "customer_id"
        fieldToPopulate: "name"
        dependsOn: "customer_id"
        nullable: false

  tradeKpiPaymentDetail:
    tableName: "servyou_ads.ads_trade_kpi_zx_order_payment_detail_rt"
    dbKey: "db1"
    sqlTemplateKey: "trade_kpi_payment_detail"
    fields:
      - name: "payment_date"
        type: "DATE"
