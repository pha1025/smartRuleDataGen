# src/main/resources/generator-rules.yml
generators:
  customerReviewExpire: # 唯一标识符，用户在CLI中选择
    tableName: "cctest_not_delete.ads_itcrm_customer_review_zx_product_expire"
    dbKey: "db2"
    sqlTemplateKey: "customer_review_expire" # 对应SqlTemplateRepository中的Key
    fields:
      - name: "end_date_month"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "formatMonth(end_date)"
        nullable: false
      - name: "end_date"
        type: "EXPRESSION"
        sqlType: "DATE" # 保持DATE，以便后续处理
        expression: "randomDateInCurrentMonth()"
        nullable: false
      - name: "customer_id"
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        refDataType: "CustomerData"
        lookupKeyField: "type"
        lookupValueSource: "1" # Default to Type 1
        fieldToPopulate: "id"
        defaultNotFoundValue: "CUST_DEFAULT"
        nullable: false
      - name: "customer_name"
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        refDataType: "CustomerData"
        lookupKeyField: "id"
        lookupValueSource: "customer_id"
        fieldToPopulate: "name"
        dependsOn: "customer_id"
        nullable: false
      - name: "customer_manage_id" # 这是一个隐藏字段，用于关联，不一定输出到SQL（如果SQL模板没用它）
        type: "REFERENCE_DATA"
        sqlType: "VARCHAR"
        includeInSql: false
        refDataType: "CustomerData"
        lookupKeyField: "id"
        lookupValueSource: "customer_id"
        fieldToPopulate: "manageId"
        dependsOn: "customer_id"
        nullable: false
      - name: "outlet_code"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: "004012020002"
        nullable: false
      - name: "expect_renew_type_code"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "expect_renew_type"
        lookupBy: "NAME"
        targetField: "CODE"
        nullable: false
      - name: "expect_renew_type"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "expect_renew_type"
        lookupBy: "CODE"
        targetField: "NAME"
        dependsOn: "expect_renew_type_code"
        nullable: false
      - name: "is_renew_code"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "is_renew"
        lookupBy: "NAME"
        targetField: "CODE"
        nullable: false
      - name: "is_renew"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "is_renew"
        lookupBy: "CODE"
        targetField: "NAME"
        dependsOn: "is_renew_code"
        nullable: false
      - name: "cur_package_paid_amount"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 500
        max: 5000
        nullable: false
      - name: "cur_package_sales_amount" # 新增字段
        type: "EXPRESSION"
        sqlType: "INT"
        expression: "cur_package_paid_amount + randomInt(0, 100)"
        nullable: false
      - name: "real_package_sales_amt"
        type: "EXPRESSION"
        sqlType: "INT"
        expression: "cur_package_paid_amount" # 简化，避免负数风险，或者 paid + small_diff
        nullable: false
      - name: "renew_package_sales_amount"
        type: "EXPRESSION"
        sqlType: "INT"
        expression: "randomInt(500, 6000)"
        nullable: false
      - name: "renew_package_paid_amount" # 假设需要这个字段
        type: "EXPRESSION"
        sqlType: "INT"
        expression: "renew_package_sales_amount - randomInt(0, 100)"
        nullable: false
      - name: "package_level"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["基础版", "专业版", "旗舰版"]
        nullable: false
      - name: "action_names"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["智能办税", "风控", "报销", "发票管理", "智能办税,风控"]
        nullable: false
      - name: "renew_package_level"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "package_level"
        nullable: false
      - name: "avg_applicants_num"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 10
        nullable: false
      - name: "in_invoice_avg_amt"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 1000
        nullable: false
      - name: "out_invoice_avg_amt"
        type: "RANDOM_INT"
        sqlType: "INT"
        min: 0
        max: 1000
        nullable: false
      - name: "is_compliance_tax_target"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["Y", "N"]
        nullable: false
      - name: "active_compliance_status"
        type: "CONDITIONAL"
        sqlType: "VARCHAR"
        nullable: false
        conditions:
          - ifExpression: "is_compliance_tax_target == 'Y'"
            thenValue: "compliance"
          - elseValue: "notCompliance"
      - name: "lastest_follow_time"
        type: "STATIC"
        sqlType: "DATETIME"
        value: "NULL"
        nullable: true
      - name: "follow_type"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "follow_type_name"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "follow_progress"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "follow_progress_name"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "follow_intention"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "follow_intention_name"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: ""
        nullable: false
      - name: "lastest_payment_method_name"
        type: "STATIC"
        sqlType: "VARCHAR"
        value: "NULL"
        nullable: true
      - name: "lastest_payment_time"
        type: "STATIC"
        sqlType: "DATETIME"
        value: "NULL"
        nullable: true
      - name: "lastest_order_time"
        type: "STATIC"
        sqlType: "DATETIME"
        value: "NULL"
        nullable: true
      - name: "renew_type"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "renew_type"
        lookupBy: "CODE"
        targetField: "NAME"
        dependsOn: "renew_type_code"
        nullable: false
      - name: "renew_type_code"
        type: "ENUM_LOOKUP"
        sqlType: "VARCHAR"
        category: "renew_type"
        lookupBy: "NAME"
        targetField: "CODE"
        nullable: false
      - name: "cust_mgr_id"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "customer_manage_id" # 优先使用从 CustomerData 反查出来的 manageId
        nullable: false
      - name: "cust_mgr_name"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrName')"
        nullable: false
      - name: "big_region_code" # 注意顺序，big_region_code 需要先于 province_city_area_code
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupCustMgrField(cust_mgr_id, 'custMgrBigRegionCode')"
        nullable: false
      - name: "province_city_area_code"
        type: "EXPRESSION"
        sqlType: "VARCHAR"
        expression: "lookupProvinceByRegion(big_region_code)"
        nullable: false
      - name: "is_order"
        type: "LIST_RANDOM"
        sqlType: "VARCHAR"
        values: ["Y", "N"]
        nullable: false

  tradeKpiPayment:
